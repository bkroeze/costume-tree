services:
  costume-tree:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      COSTUMETREE_DIR: /photos
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${COSTUMETREE_DIR:-./costume-tree-photos}"
        target: /photos
        bind:
          create_host_path: false
    restart: unless-stopped
