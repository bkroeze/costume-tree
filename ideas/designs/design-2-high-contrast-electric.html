<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costume Tree — Electric Cobalt Neo-Brutalist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --cobalt: #2563eb;
      --cobalt-dark: #1d4ed8;
      --yellow: #fde047;
      --magenta: #ec4899;
      --coral: #ff5940;
      --mint: #10b981;
      --black: #0f172a;
      --border-width: 3px;
      --radius: 14px;
      --shadow: 5px 5px 0px #0f172a;
      --shadow-sm: 3px 3px 0px #0f172a;
      --shadow-lg: 8px 8px 0px #0f172a;
      --font-heading: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-heading);
      background: var(--bg);
      color: var(--black);
      line-height: 1.4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    /* Top Nav */
    header {
      background: var(--yellow);
      border-bottom: var(--border-width) solid var(--black);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--black);
    }
    .logo-stamp {
      background: var(--black);
      color: var(--yellow);
      font-weight: 800;
      font-size: 1.25rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
    }
    .prod-badge {
      background: #fff;
      border: var(--border-width) solid var(--black);
      padding: 0.35rem 0.9rem;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.9rem;
      box-shadow: 2px 2px 0px var(--black);
    }

    /* Big Bold Buttons */
    .btn-brutal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      font-weight: 800;
      font-size: 1.05rem;
      border-radius: var(--radius);
      border: var(--border-width) solid var(--black);
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      font-family: var(--font-heading);
    }
    .btn-brutal:hover {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow-lg);
    }
    .btn-brutal:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--black);
    }
    .btn-cobalt { background: var(--cobalt); color: #fff; }
    .btn-magenta { background: var(--magenta); color: #fff; }
    .btn-white { background: #fff; color: var(--black); }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.85rem; border-radius: 8px; box-shadow: var(--shadow-sm); }

    main {
      flex: 1;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* KPI Banner */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .kpi-card {
      background: var(--card-bg);
      border: var(--border-width) solid var(--black);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .kpi-card.highlight-blue { background: #dbeafe; }
    .kpi-card.highlight-green { background: #d1fae5; }
    .kpi-card.highlight-red { background: #fee2e2; }
    .kpi-card.highlight-yellow { background: #fef08a; }

    .kpi-title { font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi-val { font-family: var(--font-mono); font-size: 2.75rem; font-weight: 800; line-height: 1; margin: 0.6rem 0 0.2rem; }
    .kpi-sub { font-size: 0.9rem; font-weight: 700; color: #475569; }

    /* Quick Filter & Fast Action Toolbar */
    .toolbar-box {
      background: var(--card-bg);
      border: var(--border-width) solid var(--black);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .search-pill-input {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border: var(--border-width) solid var(--black);
      border-radius: 9999px;
      padding: 0.35rem 1rem;
      gap: 0.5rem;
      flex: 1;
      max-width: 450px;
    }
    .search-pill-input input {
      border: none;
      background: transparent;
      outline: none;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      width: 100%;
    }

    .toggles-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .toggle-btn {
      border: 2px solid var(--black);
      background: #fff;
      padding: 0.4rem 0.9rem;
      font-weight: 800;
      font-size: 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--black);
      transition: all 0.1s;
    }
    .toggle-btn.active {
      background: var(--black);
      color: #fff;
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    /* Actor Feed Cards */
    .actor-feed {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .actor-block {
      background: var(--card-bg);
      border: var(--border-width) solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .actor-summary-bar {
      padding: 1.25rem 1.5rem;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
      border-bottom: var(--border-width) solid var(--black);
    }
    .actor-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .badge-icon {
      width: 50px;
      height: 50px;
      background: var(--yellow);
      border: var(--border-width) solid var(--black);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.3rem;
      box-shadow: var(--shadow-sm);
    }
    .actor-name-text { font-size: 1.35rem; font-weight: 800; }
    .actor-role-text { font-size: 0.95rem; font-weight: 700; color: #64748b; }

    .actor-progress-meter {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 260px;
    }
    .progress-bar-brutal {
      flex: 1;
      height: 18px;
      background: #e2e8f0;
      border: 2px solid var(--black);
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill-brutal {
      height: 100%;
      background: var(--cobalt);
    }
    .pct-label {
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 1.15rem;
      min-width: 50px;
      text-align: right;
    }

    /* Pieces Subtable */
    .pieces-table-wrap {
      padding: 1rem 1.5rem 1.5rem;
      background: #f8fafc;
    }
    .pieces-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
      margin-top: 0.75rem;
    }
    .piece-card-brutal {
      background: #fff;
      border: 2px solid var(--black);
      border-radius: 10px;
      padding: 0.9rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .piece-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .id-tag {
      font-family: var(--font-mono);
      background: var(--black);
      color: #fff;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .status-brutal {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1.5px solid var(--black);
      text-transform: uppercase;
    }
    .status-done { background: #86efac; }
    .status-prog { background: var(--yellow); }
    .status-block { background: #fca5a5; }

    .blocker-alert {
      margin-top: 0.5rem;
      background: #fee2e2;
      border: 1.5px solid var(--coral);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #991b1b;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }
    .modal-content-brutal {
      background: #fff;
      border: var(--border-width) solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 600px;
      padding: 2rem;
    }
    .form-row { margin-bottom: 1.25rem; }
    .form-row label { display: block; font-weight: 800; font-size: 0.9rem; margin-bottom: 0.35rem; }
    .input-brutal {
      width: 100%;
      background: #f8fafc;
      border: var(--border-width) solid var(--black);
      border-radius: 8px;
      padding: 0.75rem;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
    }
    .input-brutal:focus { background: #fff; outline: none; }

    @media (max-width: 768px) {
      .header-inner { flex-direction: column; align-items: stretch; }
      .actor-summary-bar { flex-direction: column; align-items: stretch; }
      .actor-progress-meter { min-width: 100%; }
    }
  </style>
</head>
<body x-data="{
  searchQuery: '',
  activeFilter: 'all',
  showAddPieceModal: false,
  actors: [
    { id: 1, name: 'Eleanor Vance', role: 'Lady Macbeth', pieces: 5, complete: 4, blocked: 1, pct: 85, expanded: true, items: [
      { id: 'C-0001', type: 'Velvet Gown', desc: 'Blood red heavy velvet', status: 'Progress', pct: 80, next: 'Hem line adjustment' },
      { id: 'C-0002', type: 'Crown / Tiara', desc: 'Antique brass with obsidian stones', status: 'Blocked', pct: 40, blocker: 'Missing obsidian cabochons from vendor', next: 'Awaiting stone shipment' },
      { id: 'C-0003', type: 'Dagger Sheath', desc: 'Hidden undergarment holster', status: 'Complete', pct: 100, next: 'Ready in dressing room' },
      { id: 'C-0004', type: 'Silk Robe', desc: 'Sleepwalking scene sheer silk', status: 'Complete', pct: 100, next: 'Pressed and bagged' },
      { id: 'C-0005', type: 'Velvet Cape', desc: 'Ermine trim winter mantle', status: 'Complete', pct: 100, next: 'Complete' }
    ]},
    { id: 2, name: 'Marcus Sterling', role: 'Macbeth', pieces: 6, complete: 5, blocked: 0, pct: 92, expanded: false, items: [
      { id: 'C-0006', type: 'Tunic & Armor', desc: 'Studded leather battle cuirass', status: 'Complete', pct: 100, next: 'Final fitting approved' },
      { id: 'C-0007', type: 'High Boots', desc: 'Knee-high distress brown leather', status: 'Complete', pct: 100, next: 'Waterproofed' },
      { id: 'C-0008', type: 'Coronation Mantle', desc: 'Gold embroidered crimson wool', status: 'Progress', pct: 75, next: 'Embroidery on collar' },
      { id: 'C-0009', type: 'Claymore Scabbard', desc: 'Broadsword back-strap', status: 'Complete', pct: 100, next: 'Ready' },
      { id: 'C-0010', type: 'Banqueting Tunic', desc: 'Dark green patterned silk', status: 'Complete', pct: 100, next: 'Ready' },
      { id: 'C-0011', type: 'Ring Set', desc: 'Thane signet ring replica', status: 'Complete', pct: 100, next: 'In prop box A' }
    ]},
    { id: 3, name: 'Gideon Croft', role: 'Banquo', pieces: 4, complete: 1, blocked: 2, pct: 45, expanded: true, items: [
      { id: 'C-0012', type: 'Ghost Shroud', desc: 'Distressed tattered gray linen', status: 'Blocked', pct: 30, blocker: 'Wash test failed; staining base tunic', next: 'Need theatrical blood dye test' },
      { id: 'C-0013', type: 'Chainmail Hauberk', desc: 'Lightweight aluminum links', status: 'Blocked', pct: 20, blocker: 'Pinched neck closure', next: 'Resize shoulders' },
      { id: 'C-0014', type: 'Leather Bracers', desc: 'Cross-stitched forearms', status: 'Complete', pct: 100, next: 'Ready' },
      { id: 'C-0015', type: 'Riding Cloak', desc: 'Waxed heavy wool', status: 'Progress', pct: 60, next: 'Attach toggle clasp' }
    ]},
    { id: 4, name: 'Clara Oswald', role: 'First Witch', pieces: 3, complete: 3, blocked: 0, pct: 100, expanded: false, items: [
      { id: 'C-0016', type: 'Ragged Tattered Robe', desc: 'Layered cheesecloth & raw linen', status: 'Complete', pct: 100, next: 'Complete' },
      { id: 'C-0017', type: 'Bone Necklace', desc: 'Resin cast animal bones', status: 'Complete', pct: 100, next: 'Complete' },
      { id: 'C-0018', type: 'Muddy Footwraps', desc: 'Reinforced burlap gaiters', status: 'Complete', pct: 100, next: 'Complete' }
    ]}
  ],
  filteredActors() {
    return this.actors.filter(a => {
      const match = a.name.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    a.role.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                    a.items.some(i => i.id.toLowerCase().includes(this.searchQuery.toLowerCase()) || i.type.toLowerCase().includes(this.searchQuery.toLowerCase()));
      if (!match) return false;
      if (this.activeFilter === 'blocked') return a.blocked > 0;
      if (this.activeFilter === 'incomplete') return a.pct < 100;
      if (this.activeFilter === 'ready') return a.pct === 100;
      return true;
    });
  }
}">

  <header>
    <div class="header-inner">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="index.html" class="brand-box">
          <div class="logo-stamp">COSTUME TREE</div>
        </a>
        <div class="prod-badge">Production: Macbeth (Fall 2026) ▾</div>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <a href="index.html" class="btn-brutal btn-white btn-sm">◂ Back to Gallery</a>
        <button class="btn-brutal btn-cobalt" @click="showAddPieceModal = true">+ ADD COSTUME PIECE</button>
      </div>
    </div>
  </header>

  <main>
    <!-- KPI Overview -->
    <section class="kpi-row">
      <div class="kpi-card highlight-blue">
        <div class="kpi-title">Total Costume Pieces</div>
        <div class="kpi-val">18</div>
        <div class="kpi-sub">Across 4 Cast Members</div>
      </div>
      <div class="kpi-card highlight-green">
        <div class="kpi-title">Ready & Complete</div>
        <div class="kpi-val">13</div>
        <div class="kpi-sub">72% of total inventory</div>
      </div>
      <div class="kpi-card highlight-yellow">
        <div class="kpi-title">In Progress</div>
        <div class="kpi-val">2</div>
        <div class="kpi-sub">Active in workshop</div>
      </div>
      <div class="kpi-card highlight-red">
        <div class="kpi-title">Blocked Work</div>
        <div class="kpi-val">3</div>
        <div class="kpi-sub">Requires decision/parts</div>
      </div>
    </section>

    <!-- Toolbar -->
    <div class="toolbar-box">
      <div class="search-pill-input">
        <span>🔎</span>
        <input type="text" placeholder="Search piece ID (C-0001), actor, or garment..." x-model="searchQuery">
      </div>

      <div class="toggles-group">
        <button class="toggle-btn" :class="{ 'active': activeFilter === 'all' }" @click="activeFilter = 'all'">Show All (4)</button>
        <button class="toggle-btn" :class="{ 'active': activeFilter === 'blocked' }" @click="activeFilter = 'blocked'">🚨 Blocked (2)</button>
        <button class="toggle-btn" :class="{ 'active': activeFilter === 'incomplete' }" @click="activeFilter = 'incomplete'">⚡ Incomplete (3)</button>
        <button class="toggle-btn" :class="{ 'active': activeFilter === 'ready' }" @click="activeFilter = 'ready'">✅ 100% Ready (1)</button>
      </div>
    </div>

    <!-- Actor Feed List -->
    <div class="actor-feed">
      <template x-for="actor in filteredActors()" :key="actor.id">
        <div class="actor-block">
          <!-- Main Actor Banner -->
          <div class="actor-summary-bar" @click="actor.expanded = !actor.expanded">
            <div class="actor-info">
              <div class="badge-icon" x-text="actor.name.split(' ').map(n=>n[0]).join('')"></div>
              <div>
                <div class="actor-name-text" x-text="actor.name"></div>
                <div class="actor-role-text" x-text="`${actor.role} • ${actor.pieces} Pieces (${actor.complete} Ready)`"></div>
              </div>
            </div>

            <div class="actor-progress-meter">
              <template x-if="actor.blocked > 0">
                <span style="background: #fee2e2; border: 2px solid var(--black); padding: 0.2rem 0.6rem; border-radius: 6px; font-weight: 800; font-size: 0.8rem; color: #b91c1c;" x-text="`${actor.blocked} BLOCKED`"></span>
              </template>
              <div class="progress-bar-brutal">
                <div class="progress-fill-brutal" :style="`width: ${actor.pct}%`"></div>
              </div>
              <span class="pct-label" x-text="`${actor.pct}%`"></span>
              <span style="font-size: 1.2rem; font-weight: 800;" x-text="actor.expanded ? '▲' : '▼'"></span>
            </div>
          </div>

          <!-- Expanded Pieces Grid -->
          <div class="pieces-table-wrap" x-show="actor.expanded">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
              <span style="font-size: 0.85rem; font-weight: 800; text-transform: uppercase; color: #64748b;">Assigned Garments & Pieces</span>
              <button class="btn-brutal btn-white btn-sm" @click.stop="alert(`Opening fast piece editor for ${actor.name}`)">+ Quick Add Piece</button>
            </div>
            
            <div class="pieces-grid">
              <template x-for="item in actor.items" :key="item.id">
                <div class="piece-card-brutal">
                  <div>
                    <div class="piece-header">
                      <span class="id-tag" x-text="item.id"></span>
                      <span class="status-brutal" :class="{
                        'status-done': item.status === 'Complete',
                        'status-prog': item.status === 'Progress',
                        'status-block': item.status === 'Blocked'
                      }" x-text="item.status"></span>
                    </div>
                    <div style="font-size: 1.05rem; font-weight: 800; margin: 0.3rem 0;" x-text="item.type"></div>
                    <div style="font-size: 0.85rem; color: #475569;" x-text="item.desc"></div>
                    
                    <template x-if="item.blocker">
                      <div class="blocker-alert">
                        ⚠️ <strong>BLOCKER:</strong> <span x-text="item.blocker"></span>
                      </div>
                    </template>
                  </div>

                  <div style="margin-top: 0.8rem; border-top: 1.5px dashed #cbd5e1; padding-top: 0.5rem; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                    <span style="font-weight: 700; color: #334155;">Next: <span x-text="item.next"></span></span>
                    <span style="font-family: var(--font-mono); font-weight: 800;" x-text="`${item.pct}%`"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- Add Piece Modal -->
  <div class="modal-overlay" x-show="showAddPieceModal" style="display: none;" @click.self="showAddPieceModal = false">
    <div class="modal-content-brutal" x-show="showAddPieceModal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 800;">ADD NEW COSTUME PIECE</h2>
        <button class="btn-brutal btn-white btn-sm" @click="showAddPieceModal = false">✕</button>
      </div>

      <form @submit.prevent="alert('New costume piece allocated!'); showAddPieceModal = false;">
        <div class="form-row">
          <label>ASSIGNED ACTOR</label>
          <select class="input-brutal">
            <option>Eleanor Vance (Lady Macbeth)</option>
            <option>Marcus Sterling (Macbeth)</option>
            <option>Gideon Croft (Banquo)</option>
            <option>Clara Oswald (First Witch)</option>
          </select>
        </div>
        <div class="form-row">
          <label>ITEM TYPE / CATEGORY</label>
          <input type="text" class="input-brutal" placeholder="e.g. Leather Cuirass, Velvet Cape" required>
        </div>
        <div class="form-row">
          <label>DESCRIPTION & NOTES</label>
          <textarea class="input-brutal" rows="2" placeholder="Fabric, fit adjustments, scene context..."></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn-brutal btn-white" @click="showAddPieceModal = false">Cancel</button>
          <button type="submit" class="btn-brutal btn-cobalt">CREATE & AUTO-ID PIECE</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
